services:
  backend:
    image: ${IMAGE_NAMESPACE:-local}/demo-backend:${IMAGE_TAG:-latest}
    build:
      context: ./demo-app
    environment:
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: ${IMAGE_NAMESPACE:-local}/demo-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./demo-app-fe/frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
