name: CI and Deploy Production

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run backend tests
        working-directory: demo-app
        run: ./mvnw --batch-mode --no-transfer-progress test

  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo-app-fe/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: demo-app-fe/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: demo-app-fe/frontend
        run: npm test -- --watchAll=false
        env:
          CI: true

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/demo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-app-fe/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/demo-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    name: Deploy production to AWS EC2
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docker]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAMESPACE,IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd /home/ubuntu/app

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            cat <<EOF > .env
            IMAGE_NAMESPACE=$IMAGE_NAMESPACE
            IMAGE_TAG=$IMAGE_TAG
            BACKEND_PORT=8000
            FRONTEND_PORT=3000
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af --filter "until=72h"

      - name: Smoke test deployed backend
        run: |
          echo "Checking EC2 backend: http://${{ secrets.EC2_HOST }}:8000/health"
          curl --fail --retry 10 --retry-delay 5 http://${{ secrets.EC2_HOST }}:8000/health

      - name: Smoke test deployed frontend
        run: |
          echo "Checking EC2 frontend: http://${{ secrets.EC2_HOST }}:3000/"
          curl --fail --retry 10 --retry-delay 5 http://${{ secrets.EC2_HOST }}:3000/
