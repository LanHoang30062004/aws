name: CI and Deploy Production

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run backend tests
        working-directory: demo-app
        run: mvn --batch-mode --no-transfer-progress test

  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo-app-fe/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: demo-app-fe/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: demo-app-fe/frontend
        run: npm test -- --watchAll=false
        env:
          CI: true

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-app
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-app-fe/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    name: Deploy production to AWS EC2 via SSM
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [docker]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

     # Dùng Access Key trực tiếp, không cần OIDC / role-to-assume
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Gửi lệnh deploy thẳng vào EC2 qua SSM Run Command
      - name: Trigger deployment via AWS SSM Run Command
        run: |
          set -e

          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKER_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
          SHA="${{ github.sha }}"

          echo "Sending deployment command to instance: $INSTANCE_ID..."

          # Lệnh được đóng gói thành Base64 để tránh lỗi format JSON hoặc ký tự đặc biệt
          DEPLOY_SCRIPT=$(cat <<EOF
          set -e
          cd /home/ubuntu/app

          echo "$DOCKER_TOKEN" | sudo docker login -u "$DOCKER_USER" --password-stdin

          sudo cat <<EOT > .env
          IMAGE_NAMESPACE=$DOCKER_USER
          IMAGE_TAG=$SHA
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          EOT

          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker image prune -af --filter "until=72h"

          echo "Deployment completed successfully!"
          EOF
          )

          # Mã hoá Base64
          ENCODED_SCRIPT=$(echo "$DEPLOY_SCRIPT" | base64 -w 0)

          # Gửi command qua AWS SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy commit $SHA via GitHub Actions" \
            --parameters "commands=[\"echo $ENCODED_SCRIPT | base64 -d | bash\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command sent! Command ID: $COMMAND_ID"
          echo "Waiting for command execution to complete..."

          # Đợi tối đa 5 phút để SSM hoàn tất
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Lấy kết quả output và kiểm tra status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text)

          echo "Command Status: $STATUS"
          echo "Deployment Logs:"
          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            ERROR_OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text)
            echo "Error Logs:"
            echo "$ERROR_OUTPUT"
            exit 1
          fi
